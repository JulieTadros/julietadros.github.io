nt;margin:64px auto 0!important;padding:28px 0!important;border:0!important;background:transparent!important;color:#000!important}.project-footer-minimal a{font:400 15px/1.4 'DM Sans Variable',Arial,sans-serif!important;color:#000!important;text-decoration:none!important;display:inline-flex;align-items:center;min-height:44px;padding:8px 0;border:0!important}.project-footer-minimal a:hover{text-decoration:underline!important;text-underline-offset:4px}.project-footer-minimal a:focus-visible{outline:2px solid #000;outline-offset:4px}@media(max-width:600px){.project-footer-minimal{width:calc(100% - 36px)!important;margin-top:48px!important}}</style><link rel="stylesheet" href="assets/portfolio-consistency.css"><link rel="stylesheet" href="assets/portfolio-type.css"></head><body class="portfolio-project-page"><header class="site-header" id="portfolio-page-top"><a class="site-wordmark" href="index.html">Julie Tadros</a><nav aria-label="Main navigation"><a href="index.html#about">About</a><a href="index.html#contact">Contact ↗</a></nav></header><main class="portfolio-project"><section class="project-opening" aria-labelledby="project-title"><div class="project-info"><h1 id="project-title">The Grid</h1><div class="project-description"><p>A tennis-club identity combining expressive typography, court-inspired graphics and a green palette, applied across stationery, posters, equipment and clothing.</p></div></div><figure><button aria-label="Enlarge: The Grid Tennis Club identity across printed materials, branded balls and packaging" class="image-button" data-image="0"><img alt="The Grid Tennis Club identity across printed materials, branded balls and packaging" loading="lazy" src="https://julietadros.github.io/assets/4db00ba5e4dc4134e57e076d.jpg"></button><figcaption>Identity</figcaption></figure></section><div class="portfolio-body"><div class="gallery portfolio-masonry"><figure><button aria-label="Enlarge: The Grid stationery, welcome pack, membership card and key tags" class="image-button" data-image="1"><img alt="The Grid stationery, welcome pack, membership card and key tags" loading="lazy" src="https://julietadros.github.io/assets/79b986cd54a2a3b76c9fe87f.jpg"></button><figcaption>Stationery</figcaption></figure><figure><button aria-label="Enlarge: The Grid Tennis Club posters on a street billboard" class="image-button" data-image="2"><img alt="The Grid Tennis Club posters on a street billboard" loading="lazy" src="https://julietadros.github.io/assets/c3850976146ad5fb1adcd31b.jpg"></button><figcaption>Posters</figcaption></figure><figure><button aria-label="Enlarge: The Grid identity embroidered in green on a white cap" class="image-button" data-image="4"><img alt="The Grid identity embroidered in green on a white cap" loading="lazy" src="https://julietadros.github.io/assets/440de509af0ac1f522eac6a2.jpg"></button><figcaption>Logo on cap</figcaption></figure><figure><button aria-label="Enlarge: Close-up of The Grid identity embroidered on a white sweatshirt" class="image-button" data-image="5"><img alt="Close-up of The Grid identity embroidered on a white sweatshirt" loading="lazy" src="https://julietadros.github.io/assets/37a959fee5b12c2bc77d6562.jpg"></button><figcaption>Logo on sweatshirt</figcaption></figure><figure><button aria-label="Enlarge: White and dark green The Grid sweatshirts beside a branded tennis ball" class="image-button" data-image="6"><img alt="White and dark green The Grid sweatshirts beside a branded tennis ball" loading="lazy" src="https://julietadros.github.io/assets/442c39ac83a6b87625b369b1.jpg"></button><figcaption>Sweatshirts</figcaption></figure></div></div></main><footer class="project-footer-minimal"><a href="index.html#work">← All work</a><a href="#portfolio-page-top" aria-label="Return to the top of this project">Top ↑</a></footer><dialog aria-label="The Grid image viewer"><div class="controls"><button aria-label="Previous image" id="previous"></button><span aria-live="polite" id="counter"></span><button aria-label="Next image" id="next"></button><button id="close">Close ×</button></div><img alt="" id="enlarged"></dialog><script>
const entries=[...document.querySelectorAll('.image-button')],viewer=document.querySelector('dialog'),full=document.querySelector('#enlarged');let current=0;
function show(i){current=(i+entries.length)%entries.length;const img=entries[current].querySelector('img');full.src=img.src;full.alt=img.alt;document.querySelector('#counter').textContent=(current+1)+' / '+entries.length;}
entries.forEach((b,i)=>b.addEventListener('click',()=>{show(i);viewer.showModal()}));document.querySelector('#close').onclick=()=>viewer.close();document.querySelector('#previous').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);viewer.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}});
</script><script>(()=>{const items=[...document.querySelectorAll('.portfolio-masonry>figure')];let queued=false;function update(){queued=false;items.forEach(f=>{const span=Math.ceil(f.getBoundingClientRect().height+24);if(f.style.gridRowEnd!=='span '+span)f.style.gridRowEnd='span '+span;});}function queue(){if(!queued){queued=true;requestAnimationFrame(update)}}items.forEach(f=>{f.querySelectorAll('img').forEach(i=>i.addEventListener('load',queue));f.querySelectorAll('video').forEach(v=>v.addEventListener('loadedmetadata',queue));});if(typeof ResizeObserver!=='undefined'){const ro=new ResizeObserver(queue);items.forEach(f=>ro.observe(f));}window.addEventListener('resize',queue);document.fonts?.ready.then(queue);queue();})();</script></body></html>
